name: CI

# Pushes to a branch with a pull request are covered by the pull_request run, so only main and
# tags run on push; otherwise every commit would build twice.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Runners are 2-4 cores; let Gradle use all of them, with a little more heap than the default 2g.
  GRADLE_FLAGS: >-
    --console=plain --build-cache
    -Dorg.gradle.workers.max=4
    -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  # The four jobs below run side by side; wall-clock time is the slowest one, not the sum.

  # Shared logic, the front end's JVM tests and every server module. No Android SDK is configured
  # (-Ptt.android=false), which is also how deploy/Dockerfile builds, so this is fast to configure.
  jvm:
    name: JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # Caches the Gradle distribution and dependencies; also validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v5
      - name: Test
        run: >-
          ./gradlew $GRADLE_FLAGS -Ptt.android=false
          jvmTest
          :server:spi:test :server:pipeline:test :server:live:test
          :server:watch:test :server:planner:test :server:app:test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports-jvm
          path: "**/build/reports/tests/"
          retention-days: 7

  # Robolectric tests: the Android halves of shared/* and the app shell (demo and live, debug only).
  android-tests:
    name: Android tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Test
        run: >-
          ./gradlew $GRADLE_FLAGS
          testAndroidHostTest :androidApp:testDemoDebugUnitTest :androidApp:testLiveDebugUnitTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports-android
          path: "**/build/reports/tests/"
          retention-days: 7

  # Debug APKs (demo and live) and lint, kept for installing by hand; see androidApp/README.md.
  android-build:
    name: Android APKs and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Assemble and lint
        run: >-
          ./gradlew $GRADLE_FLAGS
          :androidApp:assembleDemoDebug :androidApp:assembleLiveDebug
          :androidApp:lintDemoDebug :androidApp:lintLiveDebug
      - name: Upload Android debug APKs
        uses: actions/upload-artifact@v5
        with:
          name: android-debug-apks
          path: androidApp/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          retention-days: 7

  image-check:
    name: Build image (no push)
    # No `needs`: the Dockerfile compiles the server itself, so this runs alongside the tests.
    # Pull requests only: prove deploy/Dockerfile still builds.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image:
    name: Publish image
    needs: jvm
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # arm64 too, for Raspberry Pi home servers.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/tt-server
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
