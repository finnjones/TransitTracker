name: CI

# Pushes to a branch with a pull request are covered by the pull_request run, so only main and
# tags run on push; otherwise every commit would build twice.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Pull requests: a new push cancels the run before it. main: runs queue instead, so a push never
# cancels a deploy half-way.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Runners are 2-4 cores; let Gradle use all of them, with a little more heap than the default 2g.
  GRADLE_FLAGS: >-
    --console=plain --build-cache
    -Dorg.gradle.workers.max=4
    -Dorg.gradle.jvmargs=-Xmx3g
  # Android versionCode (and versionName 0.1.<n>): every run is newer than the one before, so the
  # app's CHECK FOR UPDATES offers each release published by android-release.
  TT_VERSION_CODE: ${{ github.run_number }}

jobs:
  # The four jobs below run side by side; wall-clock time is the slowest one, not the sum.

  # Shared logic, the front end's JVM tests and every server module. No Android SDK is configured
  # (-Ptt.android=false), which is also how deploy/Dockerfile builds, so this is fast to configure.
  jvm:
    name: JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # Caches the Gradle distribution and dependencies; also validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v5
      - name: Test
        run: >-
          ./gradlew $GRADLE_FLAGS -Ptt.android=false
          jvmTest
          :server:spi:test :server:pipeline:test :server:live:test
          :server:watch:test :server:planner:test :server:app:test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports-jvm
          path: "**/build/reports/tests/"
          retention-days: 7

  # Robolectric tests: the Android halves of shared/* and the app shell (demo and live, debug only).
  android-tests:
    name: Android tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Test
        run: >-
          ./gradlew $GRADLE_FLAGS
          testAndroidHostTest :androidApp:testDemoDebugUnitTest :androidApp:testLiveDebugUnitTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports-android
          path: "**/build/reports/tests/"
          retention-days: 7

  # Debug APKs (demo and live) and lint, kept for installing by hand; see androidApp/README.md.
  android-build:
    name: Android APKs and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Assemble and lint
        run: >-
          ./gradlew $GRADLE_FLAGS
          :androidApp:assembleDemoDebug :androidApp:assembleLiveDebug
          :androidApp:lintDemoDebug :androidApp:lintLiveDebug
      - name: Upload Android debug APKs
        uses: actions/upload-artifact@v5
        with:
          name: android-debug-apks
          path: androidApp/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          retention-days: 7

  # Pushes to main: a signed live APK as a GitHub release ("android-<run number>"), which the
  # app's Settings > About > CHECK FOR UPDATES finds and installs. Needs the signing key secrets
  # (androidApp/README.md, "Updates"); without them this job only warns.
  android-release:
    name: Publish Android release
    # After the Android tests and lint pass, so a broken build is never offered to phones.
    needs: [android-tests, android-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # earlier android-* tags, for the release notes

      - name: Signing key
        id: key
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so no Android release was published. See androidApp/README.md (Updates)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          # Push stays on in releases when the Firebase config is given as a secret.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > androidApp/google-services.json; fi

      - uses: actions/setup-java@v5
        if: steps.key.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5
        if: steps.key.outputs.ready == 'true'

      - name: Build signed APK
        if: steps.key.outputs.ready == 'true'
        env:
          TT_SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          TT_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TT_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TT_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew $GRADLE_FLAGS :androidApp:assembleLiveRelease

      - name: Publish release
        if: steps.key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="0.1.${TT_VERSION_CODE}"
          apk="transittracker-${name}.apk"
          cp androidApp/build/outputs/apk/live/release/androidApp-live-release.apk "$apk"
          # Notes: the commits since the previous Android release (the latest 20).
          prev=$(git describe --tags --abbrev=0 --match 'android-*' 2>/dev/null || true)
          range=${prev:+$prev..}${GITHUB_SHA}
          git log --no-merges --format='- %s' -n 20 "$range" > notes.md
          [ -s notes.md ] || git log -1 --format='- %s' "$GITHUB_SHA" > notes.md
          gh release create "android-${TT_VERSION_CODE}" "$apk" \
            --target "$GITHUB_SHA" --title "TransitTracker ${name}" --notes-file notes.md

  image-check:
    name: Build image (no push)
    # No `needs`: the Dockerfile compiles the server itself, so this runs alongside the tests.
    # Pull requests only: prove deploy/Dockerfile still builds.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image:
    name: Publish image
    needs: jvm
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # The exact image just pushed (name@digest), for the deploy job.
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v5

      # arm64 too, for Raspberry Pi home servers.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/tt-server
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: ref
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/tt-server@${DIGEST}" >> "$GITHUB_OUTPUT"

  # Pushes to main: start the new image on the home server and wait until it is healthy, so a
  # green run means the server is running this commit. Runs on a self-hosted runner on the server
  # itself (it only connects out to GitHub; the server still has no open ports). Off until the
  # TT_DEPLOY_DIR repository variable is set; setup in deploy/README.md, section 14.
  # To roll back, re-run this job in an earlier run: it deploys that run's image.
  deploy:
    name: Deploy server
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TT_DEPLOY_DIR != ''
    runs-on: [self-hosted, transittracker]
    timeout-minutes: 15
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      # Logged out again when the job ends.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        env:
          TT_DEPLOY_DIR: ${{ vars.TT_DEPLOY_DIR }}
          IMAGE: ${{ needs.image.outputs.ref }}
        run: deploy/deploy.sh "$IMAGE"

      # Through Cloudflare, as the phones see it. Optional: set TT_PUBLIC_BASE_URL to turn it on.
      - name: Check from the internet
        if: vars.TT_PUBLIC_BASE_URL != ''
        env:
          URL: ${{ vars.TT_PUBLIC_BASE_URL }}
        run: curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "${URL%/}/health"
