name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Android versionCode (and versionName 0.1.<n>): every run is newer than the one before, so the
  # app's CHECK FOR UPDATES offers each release published below.
  TT_VERSION_CODE: ${{ github.run_number }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Caches the Gradle distribution and dependencies; also validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build --console=plain

      # The runner has an Android SDK, so `build` also assembles :androidApp. The debug APKs
      # (demo and live) are kept for installing by hand; see androidApp/README.md.
      - name: Upload Android debug APKs
        uses: actions/upload-artifact@v5
        with:
          name: android-debug-apks
          path: androidApp/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  # Pushes to main: a signed live APK as a GitHub release ("android-<run number>"), which the
  # app's Settings > About > CHECK FOR UPDATES finds and installs. Needs the signing key secrets
  # (androidApp/README.md, "Updates"); without them this job only warns.
  android-release:
    name: Publish Android release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # earlier android-* tags, for the release notes

      - name: Signing key
        id: key
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so no Android release was published. See androidApp/README.md (Updates)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          # Push stays on in releases when the Firebase config is given as a secret.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > androidApp/google-services.json; fi

      - uses: actions/setup-java@v5
        if: steps.key.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5
        if: steps.key.outputs.ready == 'true'

      - name: Build signed APK
        if: steps.key.outputs.ready == 'true'
        env:
          TT_SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          TT_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TT_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TT_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleLiveRelease --console=plain

      - name: Publish release
        if: steps.key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="0.1.${TT_VERSION_CODE}"
          apk="transittracker-${name}.apk"
          cp androidApp/build/outputs/apk/live/release/androidApp-live-release.apk "$apk"
          # Notes: the commits since the previous Android release (the latest 20).
          prev=$(git describe --tags --abbrev=0 --match 'android-*' 2>/dev/null || true)
          range=${prev:+$prev..}${GITHUB_SHA}
          git log --no-merges --format='- %s' -n 20 "$range" > notes.md
          [ -s notes.md ] || git log -1 --format='- %s' "$GITHUB_SHA" > notes.md
          gh release create "android-${TT_VERSION_CODE}" "$apk" \
            --target "$GITHUB_SHA" --title "TransitTracker ${name}" --notes-file notes.md

  image-check:
    name: Build image (no push)
    needs: build
    # Branches other than main and pull requests: prove deploy/Dockerfile still builds.
    if: github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image:
    name: Publish image
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # arm64 too, for Raspberry Pi home servers.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/tt-server
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
